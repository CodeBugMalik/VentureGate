name: Add to DevRel PR/Issue Tracker
on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        continue-on-error: true
        with:
          project-url: https://github.com/orgs/midnightntwrk/projects/75
          github-token: ${{ secrets.DEVREL_TRACKER_TOKEN || secrets.GITHUB_TOKEN }}
